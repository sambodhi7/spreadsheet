services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spreadsheet
      POSTGRES_USER: spreadsheet
      POSTGRES_PASSWORD: spreadsheet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spreadsheet -d spreadsheet"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
