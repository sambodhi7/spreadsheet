[project]
name = "spreadsheet-backend"
version = "0.1.0"
description = "Backend API for the spreadsheet application"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "cachecontrol>=0.14,<1",
  "Django>=5.2,<5.3",
  "django-cors-headers>=4.7,<5",
  "django-environ>=0.12,<1",
  "djangorestframework>=3.16,<4",
  "gunicorn>=23,<24",
  "google-auth>=2.38,<3",
  "psycopg[binary]>=3.2,<4",
  "python-json-logger>=3.3,<5",
  "requests>=2.32,<3",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.8,<8",
  "pytest>=8.3,<10",
  "pytest-django>=4.11,<5",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --disable-warnings --tb=short"

[tool.coverage.run]
branch = true
source = ["apps", "config"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
